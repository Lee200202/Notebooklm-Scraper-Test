name: 每日直播逐字稿

on:
  schedule:
    # 【主要】台灣時間 週一～週五 11:10 啟動。GitHub 排程最短只能每 5 分鐘一次、而且常延遲，
    # 所以提早 10 分鐘啟動，由程式（--watch）等到 11:20 開始，每 3 分鐘檢查一次，
    # 直到今天這集轉錄完成，最晚到 14:00。時間可用 Variables 的 POLL_START／POLL_END／POLL_INTERVAL_MINUTES 調整
    - cron: "10 11 * * 1-5"
      timezone: "Asia/Taipei"
    # 【備援】萬一 11:10 那次被 GitHub 延遲太久或略過。主要那次還在執行時，這些會排隊，
    # 輪到時發現已完成就立刻結束（排隊中被取代的會顯示為 Cancelled，屬正常）
    - cron: "30,50 11 * * 1-5"
      timezone: "Asia/Taipei"
    - cron: "10,30,50 12-13 * * 1-5"
      timezone: "Asia/Taipei"
    # 台灣時間 週一～週五 15:10、15:40、16:10、16:40：Gemini 每日額度在太平洋時間午夜重置
    # （台灣 15:00，美國冬令時間期間為 16:00），萬一早上因額度不足失敗，重置後再補一次
    - cron: "10,40 15-16 * * 1-5"
      timezone: "Asia/Taipei"
    # 【每日報告】台灣時間 週一～週五 17:05（當天最後一次補跑之後）：今天這集若仍未完成，寄一封失敗通知信。
    # 下面「執行」步驟用這個 cron 字串判斷要跑報告，修改時兩處要一起改
    - cron: "5 17 * * 1-5"
      timezone: "Asia/Taipei"
  workflow_dispatch:
    inputs:
      mode:
        description: "check＝檢查設定並寄測試信（不轉錄）｜daily＝抓今天那一集｜init＝補抓最新 5 集中尚未寫入的｜report＝寄今天的報告"
        type: choice
        options: [check, daily, init, report]
        default: check
      video_id:
        description: "（選填）只轉錄這支影片，例如 r5YtdmBoMEA。有填時會忽略上面的 mode"
        type: string
        required: false
        default: ""

# 最小權限：只需要讀取程式碼
permissions:
  contents: read

# 同一時間只跑一個：轉錄要好幾分鐘，避免下一個 5 分鐘排程重複轉同一集
concurrency:
  group: daily-transcript
  cancel-in-progress: false

jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 11:10 啟動、最晚等到 14:00，再加上轉錄時間
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行
        env:
          # ---- Secrets（必填：至少設定 1 組 Gemini 與 YouTube 金鑰）----
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
          YOUTUBE_API_KEY_3: ${{ secrets.YOUTUBE_API_KEY_3 }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # ---- 寄信通知 Secrets（選填，沒設定就不寄信）----
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # ---- Variables（選填，沒設定就用程式預設值）----
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          SEGMENT_MINUTES: ${{ vars.SEGMENT_MINUTES }}
          VIDEO_FPS: ${{ vars.VIDEO_FPS }}
          INIT_VIDEO_COUNT: ${{ vars.INIT_VIDEO_COUNT }}
          READY_DELAY_MINUTES: ${{ vars.READY_DELAY_MINUTES }}
          POLL_START: ${{ vars.POLL_START }}
          POLL_END: ${{ vars.POLL_END }}
          POLL_INTERVAL_MINUTES: ${{ vars.POLL_INTERVAL_MINUTES }}
          MAX_ATTEMPTS_PER_DAY: ${{ vars.MAX_ATTEMPTS_PER_DAY }}
          CUSTOM_VOCABULARY: ${{ vars.CUSTOM_VOCABULARY }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          # ---- 手動執行的輸入值；排程觸發時為空，所以預設 daily ----
          # 透過環境變數傳入，不直接嵌進指令，避免指令注入
          MODE: ${{ inputs.mode || 'daily' }}
          VIDEO_ID: ${{ inputs.video_id }}
          # 觸發這次執行的 cron 字串（手動執行時為空）
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$VIDEO_ID" ]; then
            python main.py --video-id "$VIDEO_ID"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "5 17 * * 1-5" ]; then
            python main.py --mode report
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python main.py --mode daily --watch
          else
            python main.py --mode "$MODE"
          fi
